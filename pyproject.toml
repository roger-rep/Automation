[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-to-issue"
version = "0.1.0"
description = "Turn customer feedback into evidence-linked, human-reviewed Jira reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Nestor Rogel"}]
dependencies = [
  "streamlit==1.67.0",
  "pydantic==2.14.3",
  "openai==3.51.0",
  "requests==2.34.2",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5", "build==1.6.1"]

[project.urls]
Repository = "https://github.com/roger-rep/Automation"
Issues = "https://github.com/roger-rep/Automation/issues"

[project.scripts]
signal-to-issue = "signal_to_issue.cli:main"

[tool.setuptools.packages.find]
include = ["signal_to_issue*"]

[tool.setuptools.package-data]
signal_to_issue = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
